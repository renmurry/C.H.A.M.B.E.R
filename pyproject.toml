[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chamber"
version = "1.9.0"
description = "Turn georeferenced (Geo)PDF map sheets into GIS layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
  "pymupdf>=1.24",
  "pyproj>=3.6",
  "rasterio>=1.3.9",
  "shapely>=2.0",
  "pikepdf>=8",
  "tqdm>=4.66",
  "pyogrio>=0.8",
  "rapidocr-onnxruntime>=1.3",
  "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chamber = "chamber.cli:main"
chamber-validate = "chamber.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
